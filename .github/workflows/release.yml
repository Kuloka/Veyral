name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: windows-x64
          - os: ubuntu-22.04
            name: linux-x64
          - os: macos-15-intel
            name: macos-x64
          - os: macos-15
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run prepare:engine
      - name: Check Apple signing credentials
        id: mac_signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              missing=$((missing + 1))
            fi
          done
          if [[ "$missing" -eq 5 ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Skipping macOS artifacts until Apple signing secrets are configured'
          elif [[ "$missing" -gt 0 ]]; then
            echo '::error::Apple signing secrets are incomplete'
            exit 1
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - run: npm run dist
        if: runner.os != 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build, sign and notarize macOS app
        if: runner.os == 'macOS' && steps.mac_signing.outputs.ready == 'true'
        run: npm run dist
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS' && steps.mac_signing.outputs.ready == 'true'
        shell: bash
        run: |
          app="$(find dist -maxdepth 2 -name Veyral.app -type d -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --verbose --type exec "$app"
      - run: node tools/check-windows-elevation.cjs
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v4
        if: runner.os != 'macOS' || steps.mac_signing.outputs.ready == 'true'
        with:
          name: veyral-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.dmg
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: veyral-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: release/*
          fail_on_unmatched_files: true
